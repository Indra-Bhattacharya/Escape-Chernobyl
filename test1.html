<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Torchlight MVP - Fixed</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; background: #000; font-family: system-ui, sans-serif; }
    #blocker {
      position: absolute; inset: 0;
      background: rgba(0,0,0,0.85);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      color: #eee; text-align: center; z-index: 10;
      cursor: pointer;
    }
    #blocker h1 { font-size: 1.8rem; margin-bottom: 0.6rem; }
    #blocker p { opacity: 0.85; margin: 0.25rem 0; }
    #hud {
      position: absolute; bottom: 18px; left: 18px;
      color: #bbb; font-size: 14px; z-index: 5;
      pointer-events: none;
      text-shadow: 0 1px 3px #000;
    }
  </style>
</head>
<body>
  <div id="blocker">
    <h1>Dark Room – Torchlight MVP</h1>
    <p>Click anywhere to start</p>
    <p>WASD – Move &nbsp;&nbsp;|&nbsp;&nbsp; Mouse – Look</p>
  </div>
  <div id="hud">Torch intensity: 100%</div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.170.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.170.0/examples/jsm/"
      }
    }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { PointerLockControls } from 'three/addons/controls/PointerLockControls.js';

    // === Basic Setup ===
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x020202);
    scene.fog = new THREE.FogExp2(0x020202, 0.028);   // lighter fog

    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 50);
	camera.position.set(0, 1.6, 30);   // start a bit back so you see something
    scene.add(camera);                // ← critical fix

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.body.appendChild(renderer.domElement);

    // === Controls ===
    const controls = new PointerLockControls(camera, document.body);
    const blocker = document.getElementById('blocker');

    blocker.addEventListener('click', () => controls.lock());
    controls.addEventListener('lock',   () => blocker.style.display = 'none');
    controls.addEventListener('unlock', () => blocker.style.display = 'flex');

    const move = { forward: false, backward: false, left: false, right: false };
    const velocity = new THREE.Vector3();
    const direction = new THREE.Vector3();
    const speed = 5.0;

    document.addEventListener('keydown', e => {
      if (e.code === 'KeyW') move.forward  = true;
      if (e.code === 'KeyS') move.backward = true;
      if (e.code === 'KeyA') move.left     = true;
      if (e.code === 'KeyD') move.right    = true;
    });
    document.addEventListener('keyup', e => {
      if (e.code === 'KeyW') move.forward  = false;
      if (e.code === 'KeyS') move.backward = false;
      if (e.code === 'KeyA') move.left     = false;
      if (e.code === 'KeyD') move.right    = false;
    });
	
	// === Collision ===
	const colliders = [];                 // all solid objects
	const playerRadius = 0.38;            // player collision radius

    // === Professional Nuclear Plant Layout ===
const plantSize = 64;
const wallHeight = 5.0;

// Materials
const concreteMat = new THREE.MeshStandardMaterial({ color: 0x1a1a1a, roughness: 0.93, metalness: 0.04 });
const metalMat    = new THREE.MeshStandardMaterial({ color: 0x2a2a2e, roughness: 0.5, metalness: 0.75 });
const warningMat  = new THREE.MeshStandardMaterial({ color: 0x3a2f00, roughness: 0.8 });
const pipeMat     = new THREE.MeshStandardMaterial({ color: 0x1a2a1a, roughness: 0.35, metalness: 0.65 });
const panelMat    = new THREE.MeshStandardMaterial({ color: 0x181820, roughness: 0.55, metalness: 0.45 });
const floorMat    = new THREE.MeshStandardMaterial({ color: 0x151515, roughness: 0.9 });

// Floor & ceiling
const floor = new THREE.Mesh(new THREE.PlaneGeometry(plantSize, plantSize), floorMat);
floor.rotation.x = -Math.PI / 2;
floor.receiveShadow = true;
scene.add(floor);

const ceiling = new THREE.Mesh(new THREE.PlaneGeometry(plantSize, plantSize), concreteMat);
ceiling.rotation.x = Math.PI / 2;
ceiling.position.y = wallHeight;
ceiling.receiveShadow = true;
scene.add(ceiling);

// Outer walls
function addOuterWall(w, h, x, z, rotY) {
  const wall = new THREE.Mesh(new THREE.PlaneGeometry(w, h), concreteMat);
  wall.position.set(x, h/2, z);
  wall.rotation.y = rotY;
  wall.receiveShadow = true;
  wall.castShadow = true;
  scene.add(wall);
}
addOuterWall(plantSize, wallHeight, 0, -plantSize/2, 0);
addOuterWall(plantSize, wallHeight, 0,  plantSize/2, Math.PI);
addOuterWall(plantSize, wallHeight, -plantSize/2, 0, Math.PI/2);
addOuterWall(plantSize, wallHeight,  plantSize/2, 0, -Math.PI/2);

// Thick wall segment helper
function addWallSegment(width, height, depth, x, y, z, rotY = 0) {
  const wall = new THREE.Mesh(
    new THREE.BoxGeometry(width, height, depth),
    concreteMat
  );
  wall.position.set(x, y, z);
  wall.rotation.y = rotY;
  wall.castShadow = true;
  wall.receiveShadow = true;
  scene.add(wall);
  colliders.push(wall);
}

// Corridor (two long walls)
function addHall(w, d, x, z) {
  const t = 1.5;
  addWallSegment(t, wallHeight, d + 0.3, x - w/2, wallHeight/2, z);
  addWallSegment(t, wallHeight, d + 0.3, x + w/2, wallHeight/2, z);
}

// Room with optional doors (doors = {n, s, e, w})
function addRoom(w, d, x, z, doors = {}) {
  const t = 1.5;
  const doorWidth = 3.0;          // opening size
  const halfW = w / 2;
  const halfD = d / 2;

  // North wall
  if (doors.n) {
    const side = (w - doorWidth) / 2;
    addWallSegment(side, wallHeight, t, x - halfW + side/2, wallHeight/2, z + halfD);
    addWallSegment(side, wallHeight, t, x + halfW - side/2, wallHeight/2, z + halfD);
  } else {
    addWallSegment(w + t, wallHeight, t, x, wallHeight/2, z + halfD);
  }

  // South wall
  if (doors.s) {
    const side = (w - doorWidth) / 2;
    addWallSegment(side, wallHeight, t, x - halfW + side/2, wallHeight/2, z - halfD);
    addWallSegment(side, wallHeight, t, x + halfW - side/2, wallHeight/2, z - halfD);
  } else {
    addWallSegment(w + t, wallHeight, t, x, wallHeight/2, z - halfD);
  }

  // East wall
  if (doors.e) {
    const side = (d - doorWidth) / 2;
    addWallSegment(t, wallHeight, side, x + halfW, wallHeight/2, z - halfD + side/2);
    addWallSegment(t, wallHeight, side, x + halfW, wallHeight/2, z + halfD - side/2);
  } else {
    addWallSegment(t, wallHeight, d + t, x + halfW, wallHeight/2, z);
  }

  // West wall
  if (doors.w) {
    const side = (d - doorWidth) / 2;
    addWallSegment(t, wallHeight, side, x - halfW, wallHeight/2, z - halfD + side/2);
    addWallSegment(t, wallHeight, side, x - halfW, wallHeight/2, z + halfD - side/2);
  } else {
    addWallSegment(t, wallHeight, d + t, x - halfW, wallHeight/2, z);
  }
}

// ========== CENTRAL NUCLEAR CORE ==========
addRoom(18, 18, 0, 0, {n:true, s:true, e:true, w:true}); // large containment hall at exact center

const reactor = new THREE.Mesh(new THREE.CylinderGeometry(4.2, 4.8, 7.5, 32), metalMat);
reactor.position.set(0, 3.75, 0);
reactor.castShadow = true; reactor.receiveShadow = true;
scene.add(reactor); colliders.push(reactor);

const reactorBase = new THREE.Mesh(new THREE.CylinderGeometry(6.0, 6.0, 0.8, 32), concreteMat);
reactorBase.position.set(0, 0.4, 0);
reactorBase.receiveShadow = true;
scene.add(reactorBase); colliders.push(reactorBase);

// Warning ring
const stripeGeo = new THREE.RingGeometry(7.5, 8.5, 48);
const stripe = new THREE.Mesh(stripeGeo, warningMat);
stripe.rotation.x = -Math.PI/2;
stripe.position.y = 0.03;
scene.add(stripe);

// ========== MAIN SPINE CORRIDORS ==========
addHall(7, 24, 0,  22);   // south corridor (starts farther from core)
addHall(7, 20, 0, -20);   // north corridor
addHall(20, 7,  20, 0);   // east corridor
addHall(20, 7, -20, 0);   // west corridor

// ========== ROOMS (different sizes & functions) ==========

// Control Room complex (south-west)
addRoom(12, 10, -14, 18, {e:true});
addRoom(8, 7, -20, 24, {e:true, s:true});
addRoom(9, 8, -13, 27, {s:true});

// Turbine Hall (east)
addRoom(16, 22, 22, 8, {w:true});
addRoom(10, 9, 24, -8, {w:true});

// Secondary Generator / Electrical (north-east)
addRoom(11, 12, 18, -18, {w:true});
addRoom(8, 8, 26, -22, {w:true, n:true});

// Pump & Cooling rooms (west)
addRoom(10, 11, -18, -8, {e:true});
addRoom(9, 9, -22, 6, {e:true});
addRoom(8, 10, -24, -16, {e:true});

// Fuel Storage & Waste (north-west)
addRoom(13, 10, -17, -22, {e:true, s:true});
addRoom(9, 8, -26, -12, {e:true});

// Auxiliary & Maintenance (south-east)
addRoom(10, 9, 16, 20, {w:true});
addRoom(8, 7, 24, 22, {w:true, s:true});
addRoom(11, 8, 14, 26, {s:true});

// Small service rooms
addRoom(7, 6, -10, 12, {e:true});
addRoom(7, 6,  10, 12, {w:true});
addRoom(6, 7, -11, -10, {e:true});
addRoom(6, 7,  11, -10, {w:true});
addRoom(7, 6, -27, 2, {e:true});
addRoom(7, 6,  27, 2, {w:true});

// ========== EQUIPMENT ==========
function addPanel(w, h, x, z, rotY = 0) {
  const p = new THREE.Mesh(new THREE.BoxGeometry(w, h, 0.5), panelMat);
  p.position.set(x, h/2, z);
  p.rotation.y = rotY;
  p.castShadow = true; p.receiveShadow = true;
  scene.add(p); colliders.push(p);
}

function addTank(r, h, x, z) {
  const t = new THREE.Mesh(new THREE.CylinderGeometry(r, r, h, 16), metalMat);
  t.position.set(x, h/2, z);
  t.castShadow = true; t.receiveShadow = true;
  scene.add(t); colliders.push(t);
}

function addTurbine(x, z) {
  const base = new THREE.Mesh(new THREE.BoxGeometry(4, 1.4, 7), metalMat);
  base.position.set(x, 0.7, z);
  base.castShadow = true; base.receiveShadow = true;
  scene.add(base); colliders.push(base);

  const house = new THREE.Mesh(new THREE.CylinderGeometry(1.8, 1.8, 6.5, 16), metalMat);
  house.rotation.z = Math.PI/2;
  house.position.set(x, 2.5, z);
  house.castShadow = true; house.receiveShadow = true;
  scene.add(house); colliders.push(house);
}

// Control panels
addPanel(5.5, 2.4, -15, 16, Math.PI/2);
addPanel(4.2, 2.0, -15, 12, Math.PI/2);
addPanel(3.8, 1.8, -18, 20, Math.PI/2);
addPanel(4.0, 1.9, -9, 25);

// Turbines
addTurbine(20, 12);
addTurbine(20, 4);
addTurbine(20, -3);

// Tanks in pump & storage rooms
addTank(2.0, 4.0, -16, -6);
addTank(1.7, 3.5, -16, -11);
addTank(1.9, 3.8, -20, 4);
addTank(1.6, 3.2, -22, -14);
addTank(2.1, 4.2, -15, -20);
addTank(1.8, 3.6, -15, -24);
addTank(1.7, 3.4, 16, -16);
addTank(1.5, 3.0, 24, -20);

// ========== PIPE NETWORK ==========
function addPipe(r, len, x, y, z, rotX=0, rotZ=0) {
  const p = new THREE.Mesh(new THREE.CylinderGeometry(r, r, len, 8), pipeMat);
  p.position.set(x, y, z);
  p.rotation.x = rotX;
  p.rotation.z = rotZ;
  p.castShadow = true;
  scene.add(p);
  colliders.push(p);
}

// Main steam lines from core to turbine hall
addPipe(0.42, 22, 8, 3.8, 0, 0, Math.PI/2);
addPipe(0.36, 22, 9, 3.3, 2, 0, Math.PI/2);

// Vertical risers around core
addPipe(0.38, 5.5, -5.5, 2.8, 0);
addPipe(0.38, 5.5,  5.5, 2.8, 0);
addPipe(0.32, 5.0, 0, 2.6, -5.5);
addPipe(0.32, 5.0, 0, 2.6,  5.5);

// Ceiling pipes along main corridors
for (let i = -28; i <= 28; i += 4) {
  addPipe(0.22, 6, -2.6, wallHeight-0.75, i, Math.PI/2);
  addPipe(0.18, 6,  2.6, wallHeight-0.65, i, Math.PI/2);
}
for (let i = -28; i <= 28; i += 4) {
  addPipe(0.20, 6, i, wallHeight-0.7, -2.6, 0, Math.PI/2);
  addPipe(0.17, 6, i, wallHeight-0.6,  2.6, 0, Math.PI/2);
}

    // === TORCH (main focus) ===
    // Warm spotlight
    const torch = new THREE.SpotLight(0xffe0a0, 90, 35, Math.PI / 5.5, 0.4, 1.1);
    torch.castShadow = true;
    torch.shadow.mapSize.set(1024, 1024);
    torch.shadow.bias = -0.0002;
    torch.shadow.normalBias = 0.02;

    // Handheld offset (slightly right + down)
    torch.position.set(0.32, -0.25, 0.1);
    camera.add(torch);

    // Target that lives in the world (better for SpotLight)
    const torchTarget = new THREE.Object3D();
    scene.add(torchTarget);
    torch.target = torchTarget;

    // Small near glow so the “hand” area isn’t pure black
    const nearGlow = new THREE.PointLight(0xffcc77, 4.5, 4.0);
    nearGlow.position.copy(torch.position);
    camera.add(nearGlow);

    // Tiny ambient so the room never goes completely black
    scene.add(new THREE.AmbientLight(0x404040, 0.12));

    // === Loop ===
    const clock = new THREE.Clock();
    let t = 0;
	
	function isColliding(pos) {
  const px = pos.x;
  const pz = pos.z;
  const margin = playerRadius + 0.12;

  for (let i = 0; i < colliders.length; i++) {
    const obj = colliders[i];
    obj.updateMatrixWorld(true);
    const box = new THREE.Box3().setFromObject(obj);

    if (px >= box.min.x - margin && px <= box.max.x + margin &&
        pz >= box.min.z - margin && pz <= box.max.z + margin) {
      return true;
    }
  }
  return false;
}

    function animate() {
		requestAnimationFrame(animate);
		const delta = Math.min(clock.getDelta(), 0.05);
		t += delta;

		if (controls.isLocked) {
  velocity.x -= velocity.x * 12.0 * delta;
  velocity.z -= velocity.z * 12.0 * delta;

  direction.z = Number(move.forward) - Number(move.backward);
  direction.x = Number(move.right)   - Number(move.left);
  direction.normalize();

  if (move.forward || move.backward) velocity.z -= direction.z * speed * 9 * delta;
  if (move.left    || move.right)    velocity.x -= direction.x * speed * 9 * delta;

  // Desired movement in camera space
  const moveX = -velocity.x * delta;
  const moveZ = -velocity.z * delta;

  // Convert to world-space displacement
  const forward = new THREE.Vector3();
  controls.getDirection(forward);          // camera forward
  forward.y = 0;
  forward.normalize();

  const right = new THREE.Vector3();
  right.crossVectors(forward, new THREE.Vector3(0, 1, 0)).normalize();

  const displacement = new THREE.Vector3();
  displacement.addScaledVector(right, moveX);
  displacement.addScaledVector(forward, moveZ);

  const distance = displacement.length();
  if (distance > 0.0001) {
    const moveDir = displacement.clone().normalize();

    // Ray origin at player body height
    const origin = camera.position.clone();
    origin.y = 1.0;

    const raycaster = new THREE.Raycaster(origin, moveDir, 0, distance + playerRadius + 0.05);
    const hits = raycaster.intersectObjects(colliders, false);

    if (hits.length > 0) {
      // Stop just before the wall face
      const safeDist = Math.max(hits[0].distance - playerRadius, 0);
      camera.position.addScaledVector(moveDir, safeDist);
    } else {
      camera.position.add(displacement);
    }
  }

  // Hard plant bounds
camera.position.x = THREE.MathUtils.clamp(camera.position.x, -plantSize/2 + 1.1, plantSize/2 - 1.1);
camera.position.z = THREE.MathUtils.clamp(camera.position.z, -plantSize/2 + 1.1, plantSize/2 - 1.1);
  camera.position.y = 1.6;
}

      // Keep torch aimed forward
      const aimPoint = new THREE.Vector3(0, 0, -12);
      aimPoint.applyMatrix4(camera.matrixWorld);
      torchTarget.position.copy(aimPoint);

      // Subtle organic flicker
      const flicker = 0.90
		+ Math.sin(t * 11.3) * 0.04
		+ Math.sin(t * 23.7) * 0.025
		+ (Math.random() - 0.5) * 0.03;

      torch.intensity = 85 * flicker;
      nearGlow.intensity = 4.0 * flicker;

      document.getElementById('hud').textContent =
        `Torch intensity: ${Math.round(flicker * 100)}%`;

      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
