<body>  
	<script type="importmap">
	{
		"imports": {
			"three": "https://unpkg.com/three@0.160.0/build/three.module.js",
			"three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
		}
	}
	</script>
	<!-- Welcome Screen Overlay -->
<div id="welcome-screen">
  <div class="welcome-content">
    <h1>ABANDONED NUCLEAR FACILITY</h1>
    <p class="subtitle">Stabilize the plant or escape before the meltdown</p>
    <div class="start-btn">CLICK TO START</div>
    <p class="hint">WASD – Move · Mouse – Look · E – Interact · Flashlight always on</p>
  </div>
</div>

<style>
  #welcome-screen {
    position: fixed;
    inset: 0;
    background: radial-gradient(ellipse at center, #0a1a0a 0%, #000 80%);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 9999;

    transition: opacity 0.8s ease;
  }
  #welcome-screen.hidden {

  }

  }

    letter-spacing: 3px;

  }
  .hint {
    margin-top: 3em;

</style>
	<script type="module">
		import * as THREE from 'three';
		import { PointerLockControls } from 'three/addons/controls/PointerLockControls.js';
		import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
		// ─────────────────────────────────────────────
		// Scene setup
		// ─────────────────────────────────────────────
		const scene = new THREE.Scene();
		scene.background = new THREE.Color(0x050505);
		scene.fog = new THREE.Fog(0x050505, 12, 45);

		const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 200);
		camera.position.set(0, 1.65, 28); // start near south entrance

		const renderer = new THREE.WebGLRenderer({ antialias: true });
		renderer.setSize(window.innerWidth, window.innerHeight);
		renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
		renderer.shadowMap.enabled = true;
		renderer.shadowMap.type = THREE.PCFSoftShadowMap;
		document.body.appendChild(renderer.domElement);
		const ambient = new THREE.AmbientLight(0xffffff, 0.45);
		ambient.intensity = 0;
		scene.add(ambient);

		const hemi = new THREE.HemisphereLight(0xffffff, 0x444444, 0.4);
		hemi.position.set(0, 20, 0);
		hemi.intensity = 0;
		hemi.color.set(0x222233);
		hemi.groundColor.set(0x000000);
		scene.add(hemi);
		
		const ceilingLights = [];
    
		function addCeilingLight(x, z) {
			// actual light (slightly below ceiling so it is not buried)
			const light = new THREE.PointLight(0xFF0000, 0, 18, 1.5);
			light.position.set(x, 3.35, z);
			light.castShadow = true;
			light.shadow.mapSize.set(512, 512);
			scene.add(light);
			
			// state for the rare on-bursts
			light.userData = {
				on: false,
				timer: 0,           // frames left in current burst
				nextBurst: 60 + Math.random() * 300   // frames until next possible burst
			};				

			// visible fixture (small glowing box)
			const fixture = new THREE.Mesh(
				new THREE.BoxGeometry(0.7, 0.08, 0.7),
				new THREE.MeshStandardMaterial({
				  color: 0x222222,
				  emissive: 0xFF0000,
				  emissiveIntensity: 0
				})
			);
			fixture.position.set(x, 3.42, z);
			scene.add(fixture);
			
			// store fixture so we can dim it together with the light
			light.userData.fixture = fixture;
			ceilingLights.push(light);
		}

		// place lights in corridor + roughly in the centre of every room
		addCeilingLight(0, 20);
		addCeilingLight(0, 5);
		addCeilingLight(0, -10);
		addCeilingLight(0, -22);

		addCeilingLight(-11, 23);   // Conference A
		addCeilingLight(-11, 11.5); // Open Office
		addCeilingLight(-11, 4.5);  // Manager
		addCeilingLight(-11, -3.5); // Meeting
		addCeilingLight(-11, -19.5);// Storage

		addCeilingLight(11, 26);    // Reception
		addCeilingLight(11, 15.5);  // Sales
		addCeilingLight(11, 5.5);   // HR
		addCeilingLight(11, -1);    // Break
		addCeilingLight(11, -17);   // Conference B
		
		// ─────────────────────────────────────────────
		// Flashlight (right-hand)
		// ─────────────────────────────────────────────
		const flashlight = new THREE.SpotLight(0xfff0dd, 8.8, 28, Math.PI / 7, 0.45, 1.2);
		flashlight.castShadow = true;
		flashlight.shadow.mapSize.set(1024, 1024);
		flashlight.shadow.bias = -0.0001;

		// position relative to camera = right hand
		const flashBasePos = new THREE.Vector3(0.32, -0.28, -0.18);
		flashlight.position.copy(flashBasePos);
		camera.add(flashlight);

		// target slightly in front of the camera
		const flashTarget = new THREE.Object3D();
		flashTarget.position.set(0.32, -0.28, -8);
		camera.add(flashTarget);
		flashlight.target = flashTarget;

		scene.add(camera); // needed so the light moves with the camera
		
		// optional: simple visible flashlight body
		const flashBody = new THREE.Mesh(
		  new THREE.CylinderGeometry(0.045, 0.055, 0.28, 10),
		  new THREE.MeshStandardMaterial({ color: 0x1a1a1a, roughness: 0.35, metalness: 0.6 })
		);
		flashBody.rotation.x = Math.PI / 2;
		flashBody.position.set(0.32, -0.28, -0.02);
		camera.add(flashBody);
		
		// small lens glow
		const lens = new THREE.Mesh(
		  new THREE.CircleGeometry(0.04, 12),
		  new THREE.MeshBasicMaterial({ color: 0xffeecc })
		);
		lens.position.set(0.32, -0.28, 0.12);
		lens.rotation.y = Math.PI;
		camera.add(lens);
		
		const wallMat = new THREE.MeshStandardMaterial({ color: 0xe8e4d9, roughness: 0.85 });
		const outerWallMat = new THREE.MeshStandardMaterial({ color: 0xd0cbb8, roughness: 0.8 });
		const floorMat = new THREE.MeshStandardMaterial({ color: 0x8b7355, roughness: 0.7 });
		const corridorFloorMat = new THREE.MeshStandardMaterial({ color: 0x6b5b4a, roughness: 0.65 });
		const ceilingMat = new THREE.MeshStandardMaterial({ color: 0xf5f5f0, roughness: 0.95 });
		const doorFrameMat = new THREE.MeshStandardMaterial({ color: 0x4a3c2a, roughness: 0.6 });
		const metalMat = new THREE.MeshStandardMaterial({ color: 0x3a3e3a, roughness: 0.55, metalness: 0.55 });
		const darkMetal = new THREE.MeshStandardMaterial({ color: 0x222522, roughness: 0.4, metalness: 0.7 });
		const warningMat = new THREE.MeshBasicMaterial({ color: 0xcc7700 });
		const woodMat = new THREE.MeshStandardMaterial({ color: 0x4a3a28, roughness: 0.8 });
		// ─────────────────────────────────────────────
		// Dimensions (meters)
		// ─────────────────────────────────────────────
		const WALL_H = 3.5;          // room height
		const WALL_T = 0.2;          // wall thickness
		const DOOR_W = 1.1;          // door width
		const DOOR_H = 2.2;          // door height

		// Overall building envelope
		// X from -20 to +20  (40 m wide)
		// Z from -30 to +30  (60 m long)
		const BUILD_W = 40;
		const BUILD_L = 60;
		const BUILD_X = 0;
		const BUILD_Z = 0;
		
		const PLAYER_RADIUS = 0.35;
		const PLAYER_HEIGHT = 1.7;
		
		const colliders = [];   // stores AABB of every solid wall
		// call this AFTER every createWall that should block the player
		function addCollider(width, height, depth, x, y, z) {
		  // all our walls are axis-aligned (rotY = 0)
		  const hw = width  / 2;
		  const hd = depth  / 2;
		  const hh = height / 2;
		  colliders.push({
			minX: x - hw, maxX: x + hw,
			minZ: z - hd, maxZ: z + hd,
			minY: y - hh, maxY: y + hh
		  });
		}
		function addColliderBox(x, y, z, w, h, d) {
		  colliders.push({
			minX: x - w / 2, maxX: x + w / 2,
			minY: y - h / 2, maxY: y + h / 2,
			minZ: z - d / 2, maxZ: z + d / 2
		  });
		}
		// ─────────────────────────────────────────────
		// Helper: create a wall segment (box)
		// ─────────────────────────────────────────────
		function createWall(width, height, depth, x, y, z, rotY = 0, material = wallMat) {
			const geo = new THREE.BoxGeometry(width, height, depth);
			const mesh = new THREE.Mesh(geo, material);
			mesh.position.set(x, y, z);
			mesh.rotation.y = rotY;
			mesh.castShadow = true;
			mesh.receiveShadow = true;
			scene.add(mesh);

			// only axis-aligned walls are used in this scene → safe to add collider
			if (Math.abs(rotY) < 0.01) {
				addCollider(width, height, depth, x, y, z);
			}
			return mesh;
		}
		
		// ─────────────────────────────────────────────
		// Fixed door frame (orientation-aware)
		// orient = 'NS'  → wall faces North/South (exterior doors)
		// orient = 'EW'  → wall faces East/West   (corridor doors)
		// ─────────────────────────────────────────────
		function addDoorFrame(x, z, orient = 'NS') {
		  const jambT = 0.15;
		  const frameDepth = WALL_T + 0.12;   // protrudes a little so it never z-fights

		  if (orient === 'NS') {
			// left jamb
			createWall(jambT, DOOR_H, frameDepth,
					   x - DOOR_W/2 - jambT/2, DOOR_H/2, z, 0, doorFrameMat);
			// right jamb
			createWall(jambT, DOOR_H, frameDepth,
					   x + DOOR_W/2 + jambT/2, DOOR_H/2, z, 0, doorFrameMat);
			// lintel (sits just under the wall above)
			createWall(DOOR_W + jambT*2, 0.22, frameDepth,
					   x, DOOR_H + 0.11, z, 0, doorFrameMat);
		  } else {
			// left (south) jamb
			createWall(frameDepth, DOOR_H, jambT,
					   x, DOOR_H/2, z - DOOR_W/2 - jambT/2, 0, doorFrameMat);
			// right (north) jamb
			createWall(frameDepth, DOOR_H, jambT,
					   x, DOOR_H/2, z + DOOR_W/2 + jambT/2, 0, doorFrameMat);
			// lintel
			createWall(frameDepth, 0.22, DOOR_W + jambT*2,
					   x, DOOR_H + 0.11, z, 0, doorFrameMat);
		  }
		}
		function resolveCollisions() {
			const p = camera.position;

			// floor / ceiling
			p.y = Math.max(0.9, Math.min(WALL_H - 0.3, p.y));

			for (const c of colliders) {
				// expand collider by player radius
				const minX = c.minX - PLAYER_RADIUS;
				const maxX = c.maxX + PLAYER_RADIUS;
				const minZ = c.minZ - PLAYER_RADIUS;
				const maxZ = c.maxZ + PLAYER_RADIUS;

				// only test against walls that the player can actually touch (eye height)
				if (p.y + 0.4 < c.minY || p.y - 0.2 > c.maxY) continue;

				if (p.x > minX && p.x < maxX && p.z > minZ && p.z < maxZ) {
					// push out on the axis of least penetration
					const dx = Math.min(p.x - minX, maxX - p.x);
					const dz = Math.min(p.z - minZ, maxZ - p.z);

					if (dx < dz) {
					// push on X
						if (p.x - minX < maxX - p.x) p.x = minX;
						else p.x = maxX;
					} else {
					// push on Z
						if (p.z - minZ < maxZ - p.z) p.z = minZ;
						else p.z = maxZ;
					}
				}
			}
		}
		// ─────────────────────────────────────────────
		// FLOOR & CEILING
		// ─────────────────────────────────────────────
		const floorGeo = new THREE.BoxGeometry(BUILD_W, 0.3, BUILD_L);
		const floor = new THREE.Mesh(floorGeo, floorMat);
		floor.position.set(BUILD_X, -0.15, BUILD_Z);
		floor.receiveShadow = true;
		scene.add(floor);

		// Corridor floor (slightly different color for visual clarity)
		const corrFloor = new THREE.Mesh(
		  new THREE.BoxGeometry(4.2, 0.32, 52),
		  corridorFloorMat
		);
		corrFloor.position.set(0, -0.14, 0);
		corrFloor.receiveShadow = true;
		scene.add(corrFloor);

		const ceiling = new THREE.Mesh(
		  new THREE.BoxGeometry(BUILD_W, 0.2, BUILD_L),
		  ceilingMat
		);
		ceiling.position.set(BUILD_X, WALL_H + 0.1, BUILD_Z);
		ceiling.receiveShadow = true;
		scene.add(ceiling);
		
		// ─────────────────────────────────────────────
		// Exterior walls (south & north) – also add the
		// wall piece ABOVE each exit door
		// ─────────────────────────────────────────────
		// South outer wall
		const exitGap = DOOR_W + 0.08;          // tight gap
		const sideW   = (BUILD_W - exitGap) / 2; // ≈ 19.45

		// South wall – left & right full-height pieces
		createWall(sideW, WALL_H, WALL_T,
				   - (exitGap/2 + sideW/2), WALL_H/2, 30, 0, outerWallMat);
		createWall(sideW, WALL_H, WALL_T,
				   + (exitGap/2 + sideW/2), WALL_H/2, 30, 0, outerWallMat);

		// wall above the south door
		{
		  const lintelTop = DOOR_H + 0.22;
		  const aboveH = WALL_H - lintelTop;
		  createWall(exitGap, aboveH, WALL_T,
					 0, lintelTop + aboveH/2, 30, 0, outerWallMat);
		}

		// North outer wall
		createWall(sideW, WALL_H, WALL_T,
				   - (exitGap/2 + sideW/2), WALL_H/2, -30, 0, outerWallMat);
		createWall(sideW, WALL_H, WALL_T,
				   + (exitGap/2 + sideW/2), WALL_H/2, -30, 0, outerWallMat);
		// wall above the north door
		{
		  const lintelTop = DOOR_H + 0.22;
		  const aboveH = WALL_H - lintelTop;
		  createWall(exitGap, aboveH, WALL_T,
					 0, lintelTop + aboveH/2, -30, 0, outerWallMat);
		}

		// East & West outer walls stay the same
		createWall(WALL_T, WALL_H, BUILD_L, 20, WALL_H/2, 0, 0, outerWallMat);
		createWall(WALL_T, WALL_H, BUILD_L, -20, WALL_H/2, 0, 0, outerWallMat);

		// Exterior door frames (now correctly oriented)
		addDoorFrame(0,  30, 'NS');   // south exit
		addDoorFrame(0, -30, 'NS');   // north exit
		
		// ── Room definitions ──────────────────────────────────────────────
		// Each room: { name, xMin, xMax, zMin, zMax, doorZ, side }
		// side = 'W' or 'E'
		const rooms = [
			// WEST SIDE – depths: 14, 9, 5, 11, 21  (all different)
			{ name: "Reactor Hall",   xMin: -20, xMax: -2.1, zMin: 16,  zMax: 30,  doorZ: 23,   side: 'W' }, // 14 m
			{ name: "Control Room",   xMin: -20, xMax: -2.1, zMin: 7,   zMax: 16,  doorZ: 11.5, side: 'W' }, //  9 m
			{ name: "Security",       xMin: -20, xMax: -2.1, zMin: 2,   zMax: 7,   doorZ: 4.5,  side: 'W' }, //  5 m
			{ name: "Decontam",       xMin: -20, xMax: -2.1, zMin: -9,  zMax: 2,   doorZ: -3.5, side: 'W' }, // 11 m
			{ name: "Waste Storage",  xMin: -20, xMax: -2.1, zMin: -30, zMax: -9,  doorZ: -19.5,side: 'W' }, // 21 m

			// EAST SIDE – depths: 8, 13, 7, 6, 26  (all different from each other AND from west)
			{ name: "Entrance Lock",  xMin:  2.1, xMax: 20,  zMin: 22,  zMax: 30,  doorZ: 26,   side: 'E' }, //  8 m
			{ name: "Turbine Bay",    xMin:  2.1, xMax: 20,  zMin: 9,   zMax: 22,  doorZ: 15.5, side: 'E' }, // 13 m
			{ name: "Monitoring",     xMin:  2.1, xMax: 20,  zMin: 2,   zMax: 9,   doorZ: 5.5,  side: 'E' }, //  7 m
			{ name: "Break / Contam", xMin:  2.1, xMax: 20,  zMin: -4,  zMax: 2,   doorZ: -1,   side: 'E' }, //  6 m
			{ name: "Core Access",    xMin:  2.1, xMax: 20,  zMin: -30, zMax: -4,  doorZ: -17,  side: 'E' }, // 26 m
		];
		// ─────────────────────────────────────────────
		// Fixed corridor wall segment – now includes the
		// solid wall ABOVE the door (so opening stops at DOOR_H)
		// ─────────────────────────────────────────────
		function corridorWallSegment(x, zStart, zEnd, doorZ = null) {
		  if (doorZ === null) {
			const len = zEnd - zStart;
			createWall(WALL_T, WALL_H, len, x, WALL_H/2, (zStart + zEnd)/2);
			return;
		  }

		  const gap = DOOR_W + 0.04;

		  // south of door (full height)
		  if (doorZ - gap/2 > zStart) {
			const len = (doorZ - gap/2) - zStart;
			createWall(WALL_T, WALL_H, len, x, WALL_H/2, zStart + len/2);
		  }

		  // north of door (full height)
		  if (doorZ + gap/2 < zEnd) {
			const len = zEnd - (doorZ + gap/2);
			createWall(WALL_T, WALL_H, len, x, WALL_H/2, doorZ + gap/2 + len/2);
		  }

		  // solid wall ABOVE the door – starts at top of lintel
		  const lintelTop = DOOR_H + 0.22;
		  const aboveH = WALL_H - lintelTop;
		  createWall(WALL_T, aboveH, gap,
					 x, lintelTop + aboveH/2, doorZ);

		  addDoorFrame(x, doorZ, 'EW');
		}		

		// Build corridor side walls with doors
		// West corridor wall (x = -2.1)
		corridorWallSegment(-2.1, 16, 30, 23);
		corridorWallSegment(-2.1, 7,  16, 11.5);
		corridorWallSegment(-2.1, 2,  7,  4.5);
		corridorWallSegment(-2.1, -9, 2,  -3.5);
		corridorWallSegment(-2.1, -30,-9, -19.5);

		// East corridor wall (x = +2.1)
		corridorWallSegment(2.1, 22, 30, 26);
		corridorWallSegment(2.1, 9,  22, 15.5);
		corridorWallSegment(2.1, 2,  9,  5.5);
		corridorWallSegment(2.1, -4, 2,  -1);
		corridorWallSegment(2.1, -30,-4, -17);

		// ── Internal room divider walls (north-south walls between rooms) ──
		// West side dividers
		const westDividersZ = [16, 7, 2, -9];
		westDividersZ.forEach(z => {
		  createWall(17.9, WALL_H, WALL_T, -11.05, WALL_H/2, z);
		});
		// East side dividers
		const eastDividersZ = [22, 9, 2, -4];
		eastDividersZ.forEach(z => {
		  createWall(17.9, WALL_H, WALL_T, 11.05, WALL_H/2, z);
		});

		// ── Outer side walls already exist; we just need the short walls
		// that close the rooms against the outer walls (already handled by outer walls)

		// ─────────────────────────────────────────────
		// Interactive doors + nameplates
		// ─────────────────────────────────────────────
		const doors = [];               // all interactive door objects
		const DOOR_INTERACT_DIST = 2.2; // how close the player must be
		let nearestDoor = null;

		// HTML prompt (open/close symbol)
		const doorPrompt = document.createElement('div');
		doorPrompt.style.cssText = `
		  position:absolute; left:50%; bottom:18%; transform:translateX(-50%);
		  color:#fff; font:bold 20px monospace; background:rgba(0,0,0,0.65);
		  padding:8px 16px; border-radius:8px; display:none; pointer-events:none;
		  text-shadow:0 0 6px #000; letter-spacing:1px;
		`;
		doorPrompt.textContent = '[E] Open / Close';
		document.body.appendChild(doorPrompt);

		// Create a traditional swinging door + nameplate
		function createInteractiveDoor(x, z, roomName, side) {
			const openingW = DOOR_W + 0.04;
			const doorWidth  = openingW - 0.02;   // almost fills the width (tiny clearance)
			const doorHeight = DOOR_H - 0.02;     // almost fills the height
			const doorThick  = 0.06;

		  // Hinge is placed on ONE side of the frame (real-world style)
		  // West wall (side==='W'): hinge on the south jamb (smaller Z)
		  // East wall (side==='E'): hinge on the south jamb (smaller Z) as well
		  const hingeZ = z - doorWidth / 2;          // south side of the opening
		  const pivot = new THREE.Group();
		  pivot.position.set(x, 0, hingeZ);
		  scene.add(pivot);

		  // Door panel – thin in X, wide in Z, tall in Y
		  const doorMat = new THREE.MeshStandardMaterial({
			color: 0x5c4033,
			roughness: 0.55,
			metalness: 0.05
		  });
		  const doorMesh = new THREE.Mesh(
			new THREE.BoxGeometry(doorThick, doorHeight, doorWidth),
			doorMat
		  );
		  // offset so that when rotation = 0 the door sits exactly inside the frame
		  doorMesh.position.set(0, doorHeight / 2 + 0.02, doorWidth / 2);
		  doorMesh.castShadow = true;
		  doorMesh.receiveShadow = true;

		document.addEventListener('keydown', (e) => {
		  if (e.code !== 'KeyE' || gameOver || escaped) return;

		  let nearestPanel = null;
		  let best = 2.3;
		  const camDir = new THREE.Vector3();
		  camera.getWorldDirection(camDir);

		  panels.forEach(p => {
			if (p.activated) return;
			const dx = camera.position.x - p.position.x;
			const dz = camera.position.z - p.position.z;
			const dist = Math.sqrt(dx * dx + dz * dz);
			if (dist > best) return;

			// facing check: player must look roughly toward the panel screen
			
			 // vector from panel → player
			const fromPanel = new THREE.Vector3(dx, 0, dz).normalize();
			// player is on the front side when this aligns with the panel normal
			const frontDot = fromPanel.dot(p.normal);
			
			// direction player must look (toward the panel)
			const toPanel = fromPanel.clone().negate();
			const lookDot = camDir.dot(toPanel);

			 if (lookDot > 0.60 && frontDot > 0.35) {
			  best = dist;
			  nearestPanel = p;
			}
		  });

		  if (nearestPanel) {
			const p = nearestPanel;
			p.activated = true;
			stabilized++;

			// screen → green
			p.ctx.fillStyle = '#002200';
			p.ctx.fillRect(0, 0, 256, 128);
			p.ctx.fillStyle = '#44ff44';
			p.ctx.font = 'bold 20px monospace';
			p.ctx.textAlign = 'center';
			p.ctx.fillText(p.label, 128, 48);
			p.ctx.font = '15px monospace';
			p.ctx.fillText('STATUS: STABLE', 128, 82);

			p.buttons.forEach(b => {
			  b.material.emissive = new THREE.Color(0x003300);
			  b.material.emissiveIntensity = 0.4;
			});

			if (stabilized >= TOTAL_SYSTEMS) {
			  plantUnstable = false;
			  centerMsg.style.display = 'block';
			  centerMsg.style.color = '#8f8';
			  centerMsg.textContent = 'ALL SYSTEMS STABILIZED\nProceed to EXIT';
			  setTimeout(() => centerMsg.style.display = 'none', 4000);
			}
			return;
		  }

		  // otherwise fall through to existing door logic
		  // (the previous door KeyE handler still runs)
		  else if (nearestDoor) {
				const d = nearestDoor;
				const px = camera.position.x;
				const pz = camera.position.z;

				// player is considered “in between” when inside the door opening volume
				const inDoorway =
				  Math.abs(px - d.position.x) < 0.55 &&
				  Math.abs(pz - d.position.z) < (DOOR_W / 2 + 0.25);

				if (inDoorway) return;   // do nothing – player is blocking the door

				// safe to toggle
				d.open = !d.open;
				d.targetRot = d.open
				  ? (d.side === 'W' ? -Math.PI / 2 : Math.PI / 2)
				  : 0;

				const idx = colliders.indexOf(d.collider);
				if (d.open) {
				  if (idx !== -1) colliders.splice(idx, 1);
				} else {
				  if (idx === -1) colliders.push(d.collider);
				}
			  }
		});

				direction.normalize();

				const speed = 40.0;
				if (move.forward || move.backward) velocity.z -= direction.z * speed * delta;
				if (move.left || move.right)       velocity.x -= direction.x * speed * delta;
				if (move.up)   velocity.y += speed * 0.6 * delta;
				if (move.down) velocity.y -= speed * 0.6 * delta;

				controls.moveRight(-velocity.x * delta);
				controls.moveForward(-velocity.z * delta);
				camera.position.y += velocity.y * delta;

				resolveCollisions();

			ceilingLights.forEach(light => {
				const ud = light.userData;

				if (ud.on) {
					// currently in a short “on” burst → strong flicker
					ud.timer--;
					if (ud.timer <= 0) {
					  // end of burst
					  ud.on = false;
					  light.intensity = 0;
					  ud.nextBurst = 90 + Math.random() * 400; // long dark period
					} else {
					  // random flicker while on
					  light.intensity = Math.random() < 0.25 ? 0 : (0.9 + Math.random() * 1.4);
					}
				} else {
					// dark period
					ud.nextBurst--;
					light.intensity = 0;
					if (ud.nextBurst <= 0) {
					  // start a very short burst (8–25 frames ≈ 0.15–0.4 s)
					  ud.on = true;
					  ud.timer = 8 + Math.floor(Math.random() * 18);
					}
				}

				// keep fixture in sync
				if (ud.fixture) {
					ud.fixture.material.emissiveIntensity = light.intensity * 0.75;
					ud.fixture.material.color.set(light.intensity > 0.05 ? 0xfff8e7 : 0x222222);
				}

			// ─────────────────────────────────────────────
			// Door animation + proximity check
			// (put this inside the animate() loop, before render)
			// ─────────────────────────────────────────────
			const playerPos = camera.position;
			nearestDoor = null;
			let nearestPanel = null;
			let closestDist = DOOR_INTERACT_DIST;

			doors.forEach(d => {
			  // smooth swing
			  d.currentRot += (d.targetRot - d.currentRot) * 0.12;
			  d.pivot.rotation.y = d.currentRot;

			  // proximity
			  const dist = playerPos.distanceTo(d.position);
			  if (dist < closestDist) {
				closestDist = dist;
				nearestDoor = d;
				nearestPanel = null;
			  }
			});
	
			// panels (higher priority when closer)
			panels.forEach(p => {
			  if (p.activated) return;
			  const dx = playerPos.x - p.position.x;
			  const dz = playerPos.z - p.position.z;
			  const dist = Math.sqrt(dx * dx + dz * dz);
			  if (dist < closestDist) {
				closestDist = dist;
				nearestPanel = p;
				nearestDoor = null;
			  }
			});

			// show / hide prompt
			if (nearestPanel) {
				doorPrompt.style.display = 'block';
				doorPrompt.textContent = '[E] Activate ' + nearestPanel.label;
			} else if (nearestDoor) {
				doorPrompt.style.display = 'block';
				doorPrompt.textContent = nearestDoor.open ? '[E] Close' : '[E] Open';
			} else {
				doorPrompt.style.display = 'none';
			}
	
			const moving = move.forward || move.backward || move.left || move.right;
			const t = clock.getElapsedTime();

			if (moving) {
			  // gentle up-down + slight side sway
			  const bobY = Math.sin(t * 9.0) * 0.055;
			  const bobX = Math.cos(t * 4.5) * 0.042;
			  flashlight.position.set(flashBasePos.x + bobX, flashBasePos.y + bobY, flashBasePos.z);
			  flashBody.position.set(0.32 + bobX, -0.28 + bobY, -0.02);
			  lens.position.set(0.32 + bobX, -0.28 + bobY, 0.12);

			  lens.position.lerp(new THREE.Vector3(0.32, -0.28, 0.12), 0.15);

		// ── 1. Deep unstable rumble ───────────────────
		function createRumble() {
		  const osc = audioCtx.createOscillator();
		  const gain = audioCtx.createGain();
		  const filter = audioCtx.createBiquadFilter();

		  osc.type = 'sawtooth';
		  osc.frequency.value = 28;
		  filter.type = 'lowpass';
		  filter.frequency.value = 80;

		  gain.gain.value = 0.15;
		  osc.connect(filter);
		  filter.connect(gain);
		  gain.connect(masterGain);

		  osc.start();
		  return { osc, gain, filter };
		}
		//const rumble = createRumble();

		// ── 2. Geiger-counter clicks (radiation) ──────
		function createGeiger() {
		  const bufferSize = audioCtx.sampleRate * 0.05;
		  const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
		  const data = buffer.getChannelData(0);
		  for (let i = 0; i < bufferSize; i++) {
			data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (bufferSize * 0.1));
		  }

		  function click() {
			if (!plantUnstable && radiation < 20) return;
			const src = audioCtx.createBufferSource();
			const gain = audioCtx.createGain();
			src.buffer = buffer;
			gain.gain.value = 0.08 + Math.random() * 0.1;
			src.connect(gain);
			gain.connect(masterGain);
			src.start();
		  }

		  // schedule random clicks – denser when radiation is high
		  function schedule() {
			const rate = 0.15 + (radiation / 100) * 0.6;
			click();
			setTimeout(schedule, (0.05 + Math.random() * 0.4) / rate * 1000);
		  }
		  schedule();
		}
		//createGeiger();

		// ── 3. Electrical crackling (grows over time) ─
		function createCrackling() {
		  const bufferSize = audioCtx.sampleRate * 2;
		  const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
		  const data = buffer.getChannelData(0);

		  // pink-ish noise
		  let last = 0;
		  for (let i = 0; i < bufferSize; i++) {
			const white = Math.random() * 2 - 1;
			data[i] = (last + 0.02 * white) / 1.02;
			last = data[i];
			data[i] *= 3.5;
		  }

		  const src = audioCtx.createBufferSource();
		  src.buffer = buffer;
		  src.loop = true;

		  const filter = audioCtx.createBiquadFilter();
		  filter.type = 'bandpass';
		  filter.frequency.value = 1800;
		  filter.Q.value = 1.2;

		  const gain = audioCtx.createGain();
		  gain.gain.value = 0.0;          // starts silent

		  src.connect(filter);
		  filter.connect(gain);
		  gain.connect(masterGain);
		  src.start();

		  // intensity rises with time while the plant is unstable
		  function updateCrackling() {
			if (!plantUnstable) {
			  gain.gain.value *= 0.96;     // fade out after stabilization
			} else {
			  const t = clock.getElapsedTime();
			  // slow rise that keeps growing
			  const intensity = Math.min(0.45, 0.02 + t * 0.004 + (radiation / 100) * 0.2);
			  gain.gain.value = intensity * (0.7 + Math.random() * 0.3);
			  filter.frequency.value = 1200 + Math.random() * 1200;
			}
			requestAnimationFrame(updateCrackling);
		  }
		  updateCrackling();

		  return { gain, filter };
		}

			const osc = audioCtx.createOscillator();
			const gain = audioCtx.createGain();
			osc.type = 'square';
			osc.frequency.value = 780;
			gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
			gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.8);
			osc.connect(gain);
			gain.connect(masterGain);
			osc.start();
			osc.stop(audioCtx.currentTime + 0.8);
		  }

		  function scheduleAlarm() {
			if (plantUnstable && Math.random() < 0.3) {
			  beep();
			  setTimeout(beep, 900);
			}
			setTimeout(scheduleAlarm, 8000 + Math.random() * 12000);
		  }
		  scheduleAlarm();
		}

		// ── 5. Metal stress / creaking ────────────────
		function createCreak() {
		  function creak() {
			if (!plantUnstable) return;
			const osc = audioCtx.createOscillator();
			const gain = audioCtx.createGain();
			const filter = audioCtx.createBiquadFilter();
			osc.type = 'sawtooth';
			osc.frequency.setValueAtTime(120 + Math.random() * 80, audioCtx.currentTime);
			osc.frequency.linearRampToValueAtTime(40, audioCtx.currentTime + 1.2);
			filter.type = 'lowpass';
			filter.frequency.value = 400;
			gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
			gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 1.4);
			osc.connect(filter);
			filter.connect(gain);
			gain.connect(masterGain);
			osc.start();
			osc.stop(audioCtx.currentTime + 1.5);
		  }

		  function scheduleCreak() {
			setTimeout(() => {
			  if (Math.random() < 0.4) creak();
			  scheduleCreak();
			}, 5000 + Math.random() * 10000);
		  }
		  scheduleCreak();
		}

		// ── 6. Steam / pressure hiss ──────────────────
		function createHiss() {
		  const bufferSize = audioCtx.sampleRate * 1;
		  const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
		  const data = buffer.getChannelData(0);
		  for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;

		  const src = audioCtx.createBufferSource();
		  src.buffer = buffer;
		  src.loop = true;

		  const filter = audioCtx.createBiquadFilter();
		  filter.type = 'highpass';
		  filter.frequency.value = 2400;

		  const gain = audioCtx.createGain();
		  gain.gain.value = 0.03;

		  src.connect(filter);
		  filter.connect(gain);
		  gain.connect(masterGain);
		  src.start();
		}

		const originalStartGame = startGame;   // keep a reference if you already have it

		  originalStartGame();    // then do fullscreen + hide overlay

		document.addEventListener('click', startSounds, { once: true });
		document.addEventListener('keydown', startSounds, { once: true });

		window.addEventListener('resize', () => {
		  camera.aspect = window.innerWidth / window.innerHeight;
		  camera.updateProjectionMatrix();
		  renderer.setSize(window.innerWidth, window.innerHeight);
		});
